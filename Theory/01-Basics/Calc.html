<!DOCTYPE html>

      <script src="calc_v3.js" defer></script>
</head>
<body>

    <h1>Calc with JS</h1>

    <table>
        <tr>
            <td>Enter first number</td>
            <td>
                <input type="text" id="box-1" placeholder="Enter first num">
            </td>
        </tr>

        <tr>
            <td>Enter second number</td>
            <td>
                <input type="text" id="box-2" placeholder="Enter second num">
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <button id="add">
                    +
                </button>
                <button id="sub">
                    -
                </button>
                <button id="div">
                    /
                </button>
                <button id="mul">
                    *
                </button>
            </td>
        </tr>
    </table>

    <hr>
    <h2>Result is: <span id="result"></span></h2>
    
</body>
