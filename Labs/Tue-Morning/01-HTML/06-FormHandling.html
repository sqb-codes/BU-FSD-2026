<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        textarea {
            resize: none;
            height: 200;
        }
    </style>
</head>
<body>

    <h1>Form Handling</h1>

    <!-- 
    SignIn/LogIn
    Search
    Email
    Quiz
    Post, Comment
    -->

    <!-- HTTP Methods - GET, POST, UPDATE, DELETE, PATCH... -->
    <form action="#" method="POST" enctype="multipart/form-data">
        <table>
            <tr>
                <td>
                    <label for="username">Enter your name</label>
                </td>
                <td>
                    <input type="text" id="username" placeholder="Enter your name" name="username" required autofocus value="Ravi" readonly disabled>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="">Enter your email</label>
                </td>
                <td>
                    <input type="email" placeholder="Enter your email" required value="ravi12@gmail.com" readonly disabled>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="userpwd">Enter your password</label>
                </td>
                <td>
                    <input type="password" id="userpwd" placeholder="Enter your password" name="userpwd" required value="12345" readonly disabled>
                </td>
            </tr>
            <tr>
                <td>Enter your age</td>
                <td>
                    <input type="number" min="18" max="60" title="Min age is 18 and Max age is 60">
                </td>
            </tr>
            <tr>
                <td>Enter DOB</td>
                <td>
                    <input type="date">
                </td>
                <td>
                    <input type="time">
                </td>
                <td>
                    <input type="datetime-local">
                </td>
            </tr>
            <tr>
                <td>
                    Select country
                </td>
                <td>
                    <select>
                        <option>Select Country</option>
                        <option value="ind">India</option>
                        <option value="ind">Australia</option>
                        <option value="ind">Sri lanka</option>
                        <option value="ind">China</option>
                        <option value="ind">France</option>
                        <option value="ind">Germany</option>
                        <option value="ind">England</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Select Gender</td>
                <td>
                    <input type="radio" id="male" name="gender" value="m"> 
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="f">
                    <label for="female">Female</label>
                </td>
            </tr>
            <tr>
                <td>Select Hobbies</td>
                <td>
                    <input type="checkbox"> Cricket
                    <input type="checkbox"> Football
                    <input type="checkbox"> Chess
                    <input type="checkbox"> Badminton
                </td>
            </tr>
            <tr>
                <td>Select Range</td>
                <td>
                    <input onchange="op.value=value" type="range" value="100" min="50" max="1000" step="100">
                    <output id="op">100</output>
                </td>
            </tr>
            <tr>
                <td>Your Progress</td>
                <td>
                    <progress value="50" max="100"></progress>
                </td>
            </tr>
            <tr>
                <td>Enter your message</td>
                <td>
                    <textarea rows="5" cols="50"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- <input type="submit"> -->
                    <button type="reset">Reset Form</button>
                </td>
                <td>
                    <button type="submit">Register</button>
                </td>
            </tr>
        </table>
    </form>
    
</body>
</html>
